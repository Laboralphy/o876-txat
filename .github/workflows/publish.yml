name: Stage publish to npm

# Stages the package on npm when a GitHub release is published. Authentication uses npm trusted
# publishing (OIDC): no npm token is stored in the repository. The trusted publisher must allow
# "stage publish".
# The staged version is NOT public until a maintainer approves it with 2FA:
#   npm stage list @laboralphy/o876-txat
#   npm stage approve <stage-id>
# A release marked as "pre-release" is staged under the `next` dist-tag.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Check release tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$VERSION'"
            exit 1
          fi
      - name: Install an npm version supporting staged publishing
        run: npm install -g npm@^11.21.0
      - run: npm ci
      - name: Stage publish
        env:
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm stage publish --provenance --access public --tag "$DIST_TAG"
