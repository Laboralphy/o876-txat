version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # stay on TypeScript 6.x (typescript-eslint does not support 7) and on Node 24 types
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      # majors come as separate PRs: one incompatible major must not block the safe updates
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
