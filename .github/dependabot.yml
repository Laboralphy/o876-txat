version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # majors come as separate PRs: one incompatible major must not block the safe updates
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
